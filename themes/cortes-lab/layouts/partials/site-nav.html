<div class="nav-wrap">
  <div class="brand">
    <a href="{{ "/" | relURL }}">{{ .Site.Title }}</a>
    <span>{{ .Site.Params.tagline }}</span>
  </div>
  <nav>
    {{ range .Site.Menus.main }}
      <a href="{{ .URL }}"{{ if eq .URL $.RelPermalink }} class="active" aria-current="page"{{ end }}>{{ .Name }}</a>
    {{ end }}
  </nav>
</div>
